# We need to allow the service account of the wasmoperator controller to manage TestResources
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ring-testresource-allow-all
rules:
  - apiGroups:
      - test.dev
    resources:
      - ring-testresources
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ring-testresource-allow-all
subjects:
  - kind: ServiceAccount
    name: wasmoperator-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: ring-testresource-allow-all
  apiGroup: rbac.authorization.k8s.io
