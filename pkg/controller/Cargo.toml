[package]
name = "controller"
version = "0.1.0"
authors = ["Tim Ramlot <tim.ramlot@ugent.be>", "Francesco Guardiani <francescoguard@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lazy_static = "^1.4.0"
futures-core = "^0.3.21"
futures-task = "^0.3.21"
log = "^0.4.16"
hyper-timeout = {version = "0.4.1"}
tracing = { version = "0.1.24", features = ["log"] }

# wasmtime = { version = "46.0.1", default-features = false, features = [
#     "parallel-compilation",
#     "cranelift",
#     "pooling-allocator",
#     "component-model-async",
#     "anyhow",
# ] }
#wasmtime = { path = "../wasmtime/crates/wasmtime", version = "46.0.1", #default-features = false, features = [
#    "parallel-compilation",
#    "cranelift",
#    "pooling-allocator",
#    "component-model-async",
#    "anyhow",
#] }
wasmtime = { path = "../wasmtime/crates/wasmtime", version = "46.0.1"}
# wasmtime-wasi = { version = "46.0.1" }
wasmtime-wasi = { path = "../wasmtime/crates/wasi", version = "46.0.1", features = ["p3"] }

rustls = { version = "0.23", features = ["aws-lc-rs"] }

#kube = { path = "../kube-rs/kube", version = "0.71.0", default-features = false, features = ["client", "rustls-tls", "derive", "runtime"] }
#kube = { version = "0.71.0", default-features = false, features = ["client", "rustls-tls", "derive", "runtime"] }
#k8s-openapi = { version = "0.14.0", default-features = false, features = ["v1_23"] }
#k8s-openapi = { version = "0.27.0", default-features = false, features = ["v1_31"] }

kube = { version = "4.0.0", default-features = false, features = [
    "client", 
    "rustls-tls", 
    "derive", 
    "runtime",
] }
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_36"] }
memmap2 = "0.9.3"


hyper = { version = "0.14.18", features = ["client", "http1", "http2", "stream", "tcp"] }
hyper-rustls = "^0.23.0"
tower = { version = "^0.4.12", features = ["limit", "timeout", "load-shed"] }
tower-http = { version = "0.2.5", features = ["trace", "decompression-gzip"] }
tower-service = { version = "^0.3.1" }
tokio = { version = "^1.17.0", features = ["full"] }
tokio-util = { version = "^0.7.1", features = ["codec", "io", "rt"] }
tokio-stream = "^0.1.8"
http = "^0.2.5"
http-body = "^0.4.4"
serde = { version = "^1.0.130", features = ["derive"] }
serde_json = "^1.0.79"
serde_yaml = "^0.8.23"
bincode = "^1.3.3"
http-serde = "^1.1.0"
futures = "^0.3.21"
bytes = "^1.1.0"

anyhow = "^1.0.103"
blake3 = "^1.3.1"
tracing-subscriber = { version = "^0.3.11", features = ["env-filter"] }
pin-project = "^1.0.10"
crossbeam-channel = "0.4.4"
chrono = { version = "0.4.10", features = ["serde"] }

reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dashmap = "6.1.0"
schemars = { version = "1.0", features = ["derive", "chrono04"] }
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
target-lexicon = "0.13.5"
either = "1.16.0"


[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
panic = "abort"
# debug = true


[package.metadata.cross.build.env]
passthrough = [
    "COMPILE_NONCE", "COMPILE_WITH_UNINSTANTIATE",
]

