# RBAC to allow the parent controller to manage WasmOperator resources
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wasmoperator-controller
  namespace: default
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: wasmoperator-controller
rules:
  - apiGroups:
      - test.dev
    resources:
      - wasmoperators
      - wasmoperators/status
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wasmoperator-controller
subjects:
  - kind: ServiceAccount
    name: wasmoperator-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: wasmoperator-controller
  apiGroup: rbac.authorization.k8s.io
