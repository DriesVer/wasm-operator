[package]
name = "simple-child-controller"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wit-bindgen = { git = "https://github.com/bytecodealliance/wit-bindgen", tag = "v0.26.0" }
chrono = "0.4.10"
serde = { version = "1.0.111", features = ["derive"] }
serde_json = "1.0.53"
bincode = "1.3"

[lib]
crate-type = ["cdylib"]

# [features]
# client-wasi = ["kube/client-wasi", "kube-runtime/client-wasi"]
# client = ["kube/client", "kube/rustls-tls", "kube-runtime/client", "tokio"]

# [profile.release]
# Tell `rustc` to optimize for small code size.
# opt-level = "s"

[package.metadata.cross.build.env]
passthrough = [
    "COMPILE_NONCE",
]
