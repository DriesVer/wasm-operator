apiVersion: v1
kind: Pod
metadata:
  name: controller0
  namespace: wasm-rust
spec:
  serviceAccountName: custom-controller
  containers:
    - name: controller
      image: "wasm-operator-ring-rust:latest"
      imagePullPolicy: IfNotPresent
      env:
        - name: RUST_LOG
          value: "info"
        - name: IN_NAMESPACE
          value: "wasm-rust0"
        - name: OUT_NAMESPACE
          value: "wasm-rust1"
        - name: HEAP_MEM_SIZE
          value: "90000000"
---
