apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ring-testresources.test.dev
spec:
  group: test.dev
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Nonce
          type: integer
          jsonPath: .spec.nonce
        - name: Reconcile Count
          type: integer
          jsonPath: .spec.reconcileCount
        - name: Last Updated
          type: date
          jsonPath: .spec.updatedAt
      schema:
        openAPIV3Schema:
          type: object
          description: A custom resource that is used for testing in the wasmoperator framework.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                nonce:
                  type: integer
                  format: int64
                updatedAt:
                  type: string
                  format: date-time
                reconcileCount:
                  type: integer
                  format: int64
              required:
                - nonce
          required:
            - spec
  scope: Namespaced
  names:
    plural: ring-testresources
    singular: ring-testresource
    kind: RingTestResource
    shortNames:
      - ringtestres
      - ringtr
