# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "ring-rust-operator"
version = "0.1.0"
edition = "2024"
build = "build.rs"
resolver = "2"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Async Runtime & Stream Management
tokio = { version = "1.52.3", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
futures = "0.3"

# Lets every type be Send (no problem due to wasi being single threaded)
send_wrapper = { version = "0.6.0", features = ["futures"] }

# Core Kubernetes Framework
kube = { path = "../../pkg/kube-rs/kube", version = "4.0.0", default-features = false, features = [
    "wasi-client",
    "runtime",
    "derive",
] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = { version = "1.2.1", features = ["chrono04"] }
wasip2 = "1.0.4"

# Data Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Error Handling & Logs
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 0            # Disables LLVM optimizations that collapse dummy functions
lto = false              # Prevents cross-crate/module dead code elimination
codegen-units = 16       # Reduces merging across translation units